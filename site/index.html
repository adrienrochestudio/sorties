<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorties Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--papier:#f3eee4;--encre:#1a1714;--gris:#6a6359;--filet:#ddd4c2;--accent:#b83a1a;--fond-carte:#e9e2d3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--papier:#17140f;--encre:#efe8da;--gris:#a79f90;--filet:#38322a;--accent:#f08a68;--fond-carte:#201c16}}
:root[data-theme="dark"]{--papier:#17140f;--encre:#efe8da;--gris:#a79f90;--filet:#38322a;--accent:#f08a68;--fond-carte:#201c16}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papier);color:var(--encre);font:15px/1.45 "Hanken Grotesk",sans-serif}
.page{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh}
aside{overflow-y:auto;padding:30px 28px 56px 32px}
h1{font:700 64px/.95 Fraunces,serif;letter-spacing:-.02em;margin:0 0 10px;font-variation-settings:"opsz" 144}
.maj{color:var(--gris);margin:0 0 6px}
.legende{color:var(--gris);font-size:13px;margin:0 0 28px}
.legende i{display:inline-block;vertical-align:-1px;margin:0 6px 0 12px}
.legende i:first-child{margin-left:0}
.pt-ag{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.pt-ant{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--encre)}
.pt-au{width:8px;height:8px;border-radius:50%;background:var(--gris);margin-left:13px;margin-right:6px}
.filtres{margin-bottom:34px}
.rang{display:flex;flex-wrap:wrap;align-items:center;gap:0 22px}
.rang+.rang{margin-top:2px}
button.f,select{font:500 15px "Hanken Grotesk",sans-serif;color:var(--gris);background:none;border:0;min-height:44px;padding:0;cursor:pointer}
button.f{border-bottom:2px solid transparent;border-radius:0}
button.f[aria-pressed="true"]{color:var(--encre);border-bottom-color:var(--encre)}
button.f.ac[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
select{padding-right:4px;color:var(--encre);border-bottom:2px solid var(--filet);border-radius:0}
.lbl{color:var(--gris);font-size:13px;min-width:56px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.jour{display:grid;grid-template-columns:70px 1fr;column-gap:6px;padding:18px 0 6px;border-top:1px solid var(--filet)}
.jour:first-child{border-top:0;padding-top:0}
.date{position:sticky;top:0;align-self:start}
.date b{display:block;font:600 40px/1 Fraunces,serif;font-variation-settings:"opsz" 144;letter-spacing:-.02em}
.date span{display:block;color:var(--gris);font-size:13px;margin-top:3px}
ol{list-style:none;margin:0;padding:0}
li button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:8px 0 10px}
li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
li .h{color:var(--gris);font-size:13px;font-variant-numeric:tabular-nums}
li .t{font-weight:600;font-size:16px;line-height:1.3}
li .m{color:var(--gris);font-size:14px}
li.sug .t{color:var(--accent)}
li.ant .m::after{content:" · à réserver tôt";color:var(--accent)}
li button:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.vide{color:var(--gris)}
#carte{height:100%;background:var(--fond-carte)}
.leaflet-tile-pane{filter:grayscale(.85) sepia(.3) contrast(.92) brightness(1.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:grayscale(1) invert(1) sepia(.25) brightness(.82) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:grayscale(1) invert(1) sepia(.25) brightness(.82) contrast(.9)}
.leaflet-container{font-family:"Hanken Grotesk",sans-serif}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--papier);color:var(--encre);border-radius:0;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.leaflet-popup-content{margin:14px 18px;font-size:14px;line-height:1.4}
.leaflet-popup-content strong{font:600 17px/1.2 Fraunces,serif;display:block;margin-bottom:4px}
.leaflet-popup-content a{color:var(--accent);font-weight:600}
.leaflet-container a.leaflet-popup-close-button{color:var(--gris)}
.leaflet-control-attribution{background:var(--papier)!important;color:var(--gris)!important}
.leaflet-control-attribution a{color:var(--gris)!important}
.leaflet-bar a{background:var(--papier);color:var(--encre);border-color:var(--filet);border-radius:0!important}
.mk{display:block;border-radius:50%;transition:transform .12s}
.mk-sug{width:16px;height:16px;background:var(--accent);box-shadow:0 0 0 2px var(--papier)}
.mk-ant{width:14px;height:14px;background:var(--papier);box-shadow:inset 0 0 0 3px var(--encre)}
.mk-au{width:10px;height:10px;background:var(--gris);opacity:.7}
.mk.on{transform:scale(1.7);opacity:1}
@media (max-width:760px){
 .page{grid-template-columns:1fr;grid-template-rows:42vh auto;height:auto}
 #carte{grid-row:1;height:42vh}
 aside{grid-row:2;padding:22px 18px 48px}
 h1{font-size:48px}
 .jour{grid-template-columns:58px 1fr}
 .date b{font-size:32px}
}
</style>
</head>
<body>
<div class="page">
<aside>
 <h1>Sorties</h1>
 <p class="maj" id="maj">Chargement</p>
 <p class="legende"><i class="pt-ag"></i>dans l'agenda<i class="pt-ant"></i>à réserver tôt<i class="pt-au"></i>autres</p>
 <div class="filtres" id="filtres">
  <div class="rang" id="periode" role="group" aria-label="Période">
   <span class="lbl">Période</span>
   <button class="f" type="button" data-v="7" aria-pressed="false">7 jours</button>
   <button class="f" type="button" data-v="30" aria-pressed="true">30 jours</button>
   <button class="f" type="button" data-v="183" aria-pressed="false">6 mois</button>
  </div>
  <div class="rang">
   <label class="lbl" for="theme">Thème</label>
   <select id="theme"><option value="">tous</option></select>
  </div>
  <div class="rang" id="bascules" role="group" aria-label="Filtres">
   <button class="f" type="button" data-k="pascher" aria-pressed="false">15 € ou moins</button>
   <button class="f ac" type="button" data-k="ant" aria-pressed="false">À réserver tôt</button>
   <button class="f ac" type="button" data-k="sug" aria-pressed="false">Dans mon agenda</button>
  </div>
 </div>
 <div id="liste"></div>
</aside>
<div id="carte" role="region" aria-label="Carte des sorties"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const carte=L.map("carte",{zoomControl:true}).setView([48.858,2.35],12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(carte);
const calque=L.layerGroup().addTo(carte);
let tous=[],marqueurs={},etat={periode:"30",theme:"",pascher:false,ant:false,sug:false};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prix={"gratuit":"gratuit","0-15":"15 € ou moins","15-50":"15 à 50 €","50-100":"50 à 100 €","inconnu":"prix inconnu"};
function heure(d){const x=new Date(d);return d.length>10&&(x.getHours()||x.getMinutes())?x.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":","h"):""}
const cleJour=d=>{const x=new Date(d);return `${JOURS[x.getDay()]} ${x.getDate()} ${MOIS[x.getMonth()]}`};
const cleTri=d=>d.slice(0,10);
function icone(e){const c=e.sug?"mk-sug":e.ant?"mk-ant":"mk-au";const t=e.sug?20:e.ant?18:14;return L.divIcon({className:"",html:`<i class="mk ${c}" data-id="${esc(e.id)}"></i>`,iconSize:[t,t],iconAnchor:[t/2,t/2],popupAnchor:[0,-t/2]})}
function afficher(){
 const lim=Date.now()+(+etat.periode)*864e5;
 const sel=tous.filter(e=>new Date(e.d)<=lim&&(!etat.theme||e.th===etat.theme)&&(!etat.pascher||["gratuit","0-15"].includes(e.p))&&(!etat.ant||e.ant)&&(!etat.sug||e.sug)).sort((a,b)=>a.d.localeCompare(b.d));
 calque.clearLayers();marqueurs={};
 const liste=document.getElementById("liste");
 if(!sel.length){liste.innerHTML='<p class="vide">Rien sur cette période avec ces filtres.</p>';return}
 let html="",jour="";
 for(const e of sel){
  const k=cleTri(e.d);
  if(k!==jour){const x=new Date(e.d);html+=(jour?"</ol></section>":"")+`<section class="jour"><div class="date"><b>${x.getDate()}</b><span>${JOURS[x.getDay()]}<br>${MOIS[x.getMonth()]}</span></div><ol>`;jour=k}
  const h=heure(e.d);
  const m=[e.l,prix[e.p]||""].filter(Boolean).join(" · ")+(e.pe&&e.f?" · jusqu'au "+cleJour(e.f):"");
  html+=`<li class="${e.sug?"sug":e.ant?"ant":""}"><button data-id="${esc(e.id)}">${h?`<div class="h">${esc(h)}</div>`:""}<div class="t">${esc(e.t)}</div><div class="m">${esc(m)}</div></button></li>`;
  const mk=L.marker([e.lat,e.lon],{icon:icone(e),riseOnHover:true,zIndexOffset:e.sug?1000:e.ant?500:0})
   .bindPopup(`<strong>${esc(e.t)}</strong>${esc(cleJour(e.d))}${h?" à "+esc(h):""}<br>${esc(e.l)}<br>${esc(prix[e.p]||"")}${e.u?`<br><a href="${esc(e.u)}" target="_blank" rel="noopener">Page de l'événement</a>`:""}`,{maxWidth:280});
  mk.addTo(calque);marqueurs[e.id]=mk;
 }
 liste.innerHTML=html+"</ol></section>";
 const pts=sel.map(e=>[e.lat,e.lon]);
 if(pts.length&&+etat.periode>30)carte.fitBounds(pts,{padding:[30,30],maxZoom:13});
}
const liste=document.getElementById("liste");
liste.addEventListener("click",ev=>{const b=ev.target.closest("button[data-id]");const m=b&&marqueurs[b.dataset.id];if(m){carte.setView(m.getLatLng(),Math.max(carte.getZoom(),14));m.openPopup()}});
function lueur(id,on){const el=document.querySelector(`.mk[data-id="${CSS.escape(id)}"]`);if(el)el.classList.toggle("on",on)}
liste.addEventListener("mouseover",ev=>{const b=ev.target.closest("button[data-id]");if(b)lueur(b.dataset.id,true)});
liste.addEventListener("mouseout",ev=>{const b=ev.target.closest("button[data-id]");if(b)lueur(b.dataset.id,false)});
document.getElementById("periode").addEventListener("click",ev=>{const b=ev.target.closest("button[data-v]");if(!b)return;etat.periode=b.dataset.v;document.querySelectorAll("#periode button").forEach(x=>x.setAttribute("aria-pressed",x===b));afficher()});
document.getElementById("bascules").addEventListener("click",ev=>{const b=ev.target.closest("button[data-k]");if(!b)return;etat[b.dataset.k]=!etat[b.dataset.k];b.setAttribute("aria-pressed",etat[b.dataset.k]);afficher()});
document.getElementById("theme").addEventListener("change",ev=>{etat.theme=ev.target.value;afficher()});
fetch("carte.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
 tous=d.evenements.filter(e=>e.lat!=null&&e.d);
 const g=new Date(d.genere);document.getElementById("maj").textContent=`Paris, mis à jour le ${g.getDate()} ${MOIS[g.getMonth()]} · ${tous.length} sorties`;
 const sel=document.getElementById("theme");
 [...new Set(tous.map(e=>e.th))].sort().forEach(t=>sel.add(new Option(t.replace("-"," et "),t)));
 afficher();
}).catch(()=>{document.getElementById("maj").textContent="Données indisponibles pour le moment."});
</script>
</body>
</html>
