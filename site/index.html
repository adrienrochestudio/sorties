<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorties Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--papier:#f4f1ea;--encre:#1b1b1b;--gris:#5c5a55;--filet:#d9d4c8;--plaque:#1f3a5f;--rouge:#a8322a;--fond-carte:#e8e4da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--papier:#181816;--encre:#ece8df;--gris:#a7a299;--filet:#34322d;--plaque:#8fb0d8;--rouge:#e0796f;--fond-carte:#22211e}}
:root[data-theme="dark"]{--papier:#181816;--encre:#ece8df;--gris:#a7a299;--filet:#34322d;--plaque:#8fb0d8;--rouge:#e0796f;--fond-carte:#22211e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papier);color:var(--encre);font:15px/1.45 "IBM Plex Sans",sans-serif}
.page{display:grid;grid-template-columns:minmax(330px,420px) 1fr;height:100vh}
aside{overflow-y:auto;padding:22px 20px 40px 24px}
h1{font:600 30px/1.1 Newsreader,serif;margin:0 0 4px}
.maj{color:var(--gris);font-size:13px;margin:0 0 22px}
form{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:26px;font-size:14px}
label{display:flex;align-items:center;gap:6px;min-height:44px}
select{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--gris);padding:6px 2px;min-height:44px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--plaque)}
:focus-visible{outline:2px solid var(--plaque);outline-offset:2px}
.jour{font:600 17px/1.2 Newsreader,serif;margin:26px 0 8px}
.jour:first-child{margin-top:0}
ol{list-style:none;margin:0;padding:0}
li{padding:7px 0 9px}
li button{all:unset;cursor:pointer;display:block;width:100%}
li .t{font-weight:500}
li .m{color:var(--gris);font-size:13px}
li.ant .t::after{content:"  à réserver tôt";color:var(--rouge);font-size:12px;font-weight:400}
li.sug .t{color:var(--plaque)}
.vide{color:var(--gris)}
#carte{height:100%;background:var(--fond-carte)}
.leaflet-tile-pane{filter:grayscale(.85) contrast(.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.9)}
.leaflet-popup-content{font:14px/1.4 "IBM Plex Sans",sans-serif}
.leaflet-popup-content a{color:var(--plaque)}
.legende{position:absolute;right:12px;bottom:22px;z-index:500;background:var(--papier);padding:8px 12px;font-size:12px;color:var(--gris)}
.legende span{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 10px;vertical-align:middle}
@media (max-width:760px){.page{grid-template-columns:1fr;grid-template-rows:46vh auto;height:auto}#carte{grid-row:1;height:46vh}aside{grid-row:2;padding:18px 16px 40px}.legende{bottom:auto;top:10px}}
</style>
</head>
<body>
<div class="page">
<aside>
 <h1>Sorties</h1>
 <p class="maj" id="maj">Chargement</p>
 <form id="filtres">
  <label>Période
   <select name="periode"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="183">6 mois</option></select></label>
  <label>Thème <select name="theme"><option value="">tous</option></select></label>
  <label><input type="checkbox" name="pascher"> 15 € ou moins</label>
  <label><input type="checkbox" name="ant"> à réserver tôt</label>
  <label><input type="checkbox" name="sug"> dans mon agenda</label>
 </form>
 <div id="liste"></div>
</aside>
<div id="carte" role="region" aria-label="Carte des sorties"></div>
</div>
<div class="legende"><span style="background:var(--plaque)"></span>dans l'agenda<span style="background:var(--rouge)"></span>à réserver tôt<span style="background:var(--gris)"></span>autres</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const carte=L.map("carte",{zoomControl:true}).setView([48.858,2.35],12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(carte);
const calque=L.layerGroup().addTo(carte);
let tous=[],marqueurs={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prix={"gratuit":"gratuit","0-15":"15 € ou moins","15-50":"15 à 50 €","50-100":"50 à 100 €","inconnu":"prix inconnu"};
function heure(d){const x=new Date(d);return d.length>10&&(x.getHours()||x.getMinutes())?x.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):""}
function cleJour(d){const x=new Date(d);return `${JOURS[x.getDay()]} ${x.getDate()} ${MOIS[x.getMonth()]}`}
function couleur(e){return e.sug?css("--plaque"):e.ant?css("--rouge"):css("--gris")}
function afficher(){
 const f=new FormData(document.getElementById("filtres"));
 const lim=Date.now()+(+f.get("periode"))*864e5,th=f.get("theme");
 const sel=tous.filter(e=>new Date(e.d)<=lim&&(!th||e.th===th)&&(!f.get("pascher")||["gratuit","0-15"].includes(e.p))&&(!f.get("ant")||e.ant)&&(!f.get("sug")||e.sug)).sort((a,b)=>a.d.localeCompare(b.d));
 calque.clearLayers();marqueurs={};
 const liste=document.getElementById("liste");
 if(!sel.length){liste.innerHTML='<p class="vide">Rien sur cette période avec ces filtres.</p>';return}
 let html="",jour="";
 for(const e of sel){
  const k=cleJour(e.d);
  if(k!==jour){html+=(jour?"</ol>":"")+`<h2 class="jour">${k}</h2><ol>`;jour=k}
  const m=[heure(e.d),e.l,prix[e.p]||""].filter(Boolean).join(" · ");
  html+=`<li class="${e.sug?"sug":e.ant?"ant":""}"><button data-id="${esc(e.id)}"><div class="t">${esc(e.t)}</div><div class="m">${esc(m)}${e.pe&&e.f?" · jusqu'au "+esc(cleJour(e.f)):""}</div></button></li>`;
  const mk=L.circleMarker([e.lat,e.lon],{radius:e.sug?8:6,color:couleur(e),fillColor:couleur(e),fillOpacity:e.sug||e.ant?.9:.45,weight:1})
   .bindPopup(`<strong>${esc(e.t)}</strong><br>${esc(k)} ${esc(heure(e.d))}<br>${esc(e.l)}<br>${esc(prix[e.p]||"")}${e.u?`<br><a href="${esc(e.u)}" target="_blank" rel="noopener">Page de l'événement</a>`:""}`);
  mk.addTo(calque);marqueurs[e.id]=mk;
 }
 liste.innerHTML=html+"</ol>";
 const pts=sel.map(e=>[e.lat,e.lon]);
 if(pts.length&&+f.get("periode")>30)carte.fitBounds(pts,{padding:[30,30],maxZoom:13});
}
document.getElementById("liste").addEventListener("click",ev=>{const b=ev.target.closest("button[data-id]");const m=b&&marqueurs[b.dataset.id];if(m){carte.setView(m.getLatLng(),Math.max(carte.getZoom(),14));m.openPopup()}});
document.getElementById("filtres").addEventListener("change",afficher);
fetch("carte.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
 tous=d.evenements.filter(e=>e.lat!=null&&e.d);
 const g=new Date(d.genere);document.getElementById("maj").textContent=`Mis à jour le ${g.getDate()} ${MOIS[g.getMonth()]} · ${tous.length} sorties`;
 const sel=document.querySelector("select[name=theme]");
 [...new Set(tous.map(e=>e.th))].sort().forEach(t=>sel.add(new Option(t.replace("-"," et "),t)));
 afficher();
}).catch(()=>{document.getElementById("maj").textContent="Données indisponibles pour le moment."});
</script>
</body>
</html>
